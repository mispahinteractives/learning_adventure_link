<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="format-detection" content="telephone=no">
    <meta name="HandheldFriendly" content="true" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Learning Adventure">
    <meta name="theme-color" content="#4FA3F7">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Learning Adventure</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
    <style>
        /* Declared here, not only in JS, so the boot screen never paints in a
           fallback font first. "block" hides text until Fredoka arrives. */
        @font-face {
            font-family: "Fredoka";
            font-weight: 600;
            font-display: block;
            src: url("./assets/fredoka-600-B9cSA6FN.woff2") format("woff2");
        }

        @font-face {
            font-family: "Fredoka";
            font-weight: 700;
            font-display: block;
            src: url("./assets/fredoka-700-ChT1xxR0.woff2") format("woff2");
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #6fb8f7;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        #game-container {
            position: fixed;
            inset: 0;
        }

        #game-container canvas {
            display: block;
            outline: none;
        }

        /* Boot screen: shown until the first menu is drawn, then zoomed away.
           Every animation here moves only transform and opacity, so the
           compositor runs it without layout or repaint work. Nothing plays
           until Fredoka is ready (#boot.ready), so the title pops in already
           in the right font. */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 35%, #8fd0ff 0%, #4fa3f7 60%, #2f7fe0 100%);
            font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
            transition: opacity .5s ease .1s, transform .6s cubic-bezier(.5, 0, .75, 0);
        }

        #boot.hidden {
            opacity: 0;
            transform: scale(1.12);
            pointer-events: none;
        }

        /* Drifting clouds and twinkling stars behind the title. */
        #boot .sky {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #boot .cloud {
            position: absolute;
            width: 180px;
            height: 56px;
            border-radius: 28px;
            background: #fff;
            opacity: .35;
            will-change: transform;
            animation: drift 26s linear infinite;
        }

        #boot .cloud::before,
        #boot .cloud::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: inherit;
        }

        #boot .cloud::before { width: 80px; height: 80px; left: 26px; top: -40px; }
        #boot .cloud::after { width: 60px; height: 60px; left: 88px; top: -28px; }

        #boot .cloud.c1 { top: 14%; left: 0; animation-duration: 28s; animation-delay: -6s; }
        #boot .cloud.c2 { top: 70%; left: 0; transform: scale(.7); animation-duration: 34s; animation-delay: -20s; opacity: .25; }
        #boot .cloud.c3 { top: 40%; left: 0; transform: scale(.5); animation-duration: 40s; animation-delay: -31s; opacity: .2; }

        @keyframes drift {
            from { transform: translateX(-240px); }
            to { transform: translateX(calc(100vw + 40px)); }
        }

        #boot .star {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff6b8;
            clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
            opacity: 0;
            animation: twinkle 2.6s ease-in-out infinite;
        }

        #boot .star.s1 { top: 18%; left: 16%; animation-delay: .2s; }
        #boot .star.s2 { top: 26%; left: 82%; animation-delay: 1.1s; width: 30px; height: 30px; }
        #boot .star.s3 { top: 72%; left: 12%; animation-delay: 1.7s; width: 16px; height: 16px; }
        #boot .star.s4 { top: 78%; left: 86%; animation-delay: .6s; }
        #boot .star.s5 { top: 10%; left: 58%; animation-delay: 2.1s; width: 14px; height: 14px; }
        #boot .star.s6 { top: 60%; left: 70%; animation-delay: 1.4s; width: 18px; height: 18px; }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); }
            50% { opacity: .95; transform: scale(1) rotate(90deg); }
        }

        /* Title: each letter pops in, then a ripple runs along the word. */
        #boot .title {
            position: relative;
            font-weight: 700;
            font-size: clamp(30px, 6vw, 64px);
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 4px 0 #1f5fc4, 0 8px 18px rgba(0, 0, 0, .25);
            white-space: nowrap;
        }

        #boot .title::before {
            content: "";
            position: absolute;
            inset: -60% -18%;
            z-index: -1;
            background: radial-gradient(closest-side, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0));
            opacity: 0;
        }

        #boot .title span {
            display: inline-block;
            opacity: 0;
        }

        #boot.ready .title::before { animation: glow 3s ease-in-out .6s infinite both; }

        #boot.ready .title span {
            animation:
                pop .7s cubic-bezier(.34, 1.56, .64, 1) calc(var(--i) * 55ms) both,
                ripple 2.8s ease-in-out calc(1.4s + var(--i) * 70ms) infinite;
        }

        @keyframes pop {
            0% { opacity: 0; transform: translateY(48px) scale(.2) rotate(-18deg); }
            55% { opacity: 1; transform: translateY(-14px) scale(1.18) rotate(5deg); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes ripple {
            0%, 40%, 100% { opacity: 1; transform: none; }
            12% { opacity: 1; transform: translateY(-14px) scale(1.08) rotate(-3deg); }
            24% { opacity: 1; transform: translateY(3px) scale(.98); }
        }

        @keyframes glow {
            0%, 100% { opacity: .5; transform: scale(.92); }
            50% { opacity: 1; transform: scale(1.06); }
        }

        #boot .title span:nth-child(6n+1) { color: #ff4b4b; }
        #boot .title span:nth-child(6n+2) { color: #ffa21f; }
        #boot .title span:nth-child(6n+3) { color: #ffd84a; }
        #boot .title span:nth-child(6n+4) { color: #4ccf5c; }
        #boot .title span:nth-child(6n+5) { color: #fff; }
        #boot .title span:nth-child(6n+6) { color: #c27bff; }

        /* Progress bar and tip rise in after the title. */
        #boot .bar,
        #boot .tip {
            opacity: 0;
        }

        /* fill "backwards" only, so the exit transition below can take over */
        #boot.ready .bar,
        #boot.ready .tip { opacity: 1; }
        #boot.ready .bar { animation: rise .7s cubic-bezier(.22, 1, .36, 1) .55s backwards; }
        #boot.ready .tip { animation: rise .7s cubic-bezier(.22, 1, .36, 1) .75s backwards; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(26px) scale(.9); }
            to { opacity: 1; transform: none; }
        }

        #boot .bar {
            width: min(60vw, 360px);
            height: 26px;
            border-radius: 13px;
            background: #fff;
            padding: 4px;
            box-sizing: border-box;
            box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
        }

        #boot .bar i {
            position: relative;
            display: block;
            height: 100%;
            width: 4%;
            overflow: hidden;
            border-radius: 9px;
            background: linear-gradient(#7be86f, #22b13a);
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, .4);
            transition: width .35s cubic-bezier(.22, 1, .36, 1);
        }

        /* a soft shine sweeping along the fill */
        #boot .bar i::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 60px;
            background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .6), rgba(255, 255, 255, 0));
            transform: translateX(-80px);
            animation: shine 1.6s ease-in-out infinite;
        }

        @keyframes shine {
            from { transform: translateX(-80px); }
            to { transform: translateX(380px); }
        }

        #boot .tip {
            font-weight: 600;
            font-size: 16px;
            color: rgba(255, 255, 255, .92);
        }

        #boot .tip b {
            display: inline-block;
            font-weight: inherit;
            animation: hop 1.2s ease-in-out infinite;
        }

        #boot .tip b:nth-of-type(2) { animation-delay: .15s; }
        #boot .tip b:nth-of-type(3) { animation-delay: .3s; }

        @keyframes hop {
            0%, 60%, 100% { transform: none; }
            30% { transform: translateY(-6px); }
        }

        /* The title lifts away as the screen zooms out. */
        #boot .title,
        #boot .bar,
        #boot .tip {
            transition: transform .5s cubic-bezier(.5, 0, .75, 0);
        }

        #boot.hidden .title { transform: translateY(-40px); }
        #boot.hidden .bar,
        #boot.hidden .tip { transform: translateY(30px); }

        @media (prefers-reduced-motion: reduce) {
            #boot *,
            #boot *::before,
            #boot *::after {
                animation-duration: .01ms !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
            }

            #boot .cloud, #boot .star { display: none; }
            #boot.hidden, #boot.hidden .title, #boot.hidden .bar, #boot.hidden .tip { transform: none; }
        }
        /* The game is landscape, like every mockup: ask portrait phones and
           tablets to turn sideways. */
        #rotate {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: radial-gradient(ellipse at 50% 35%, #8fd0ff 0%, #4fa3f7 60%, #2f7fe0 100%);
            font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #fff;
            text-align: center;
            padding: 24px;
            text-shadow: 0 3px 0 #1f5fc4;
        }

        #rotate .phone {
            width: 70px;
            height: 112px;
            border: 8px solid #fff;
            border-radius: 18px;
            animation: turn 1.8s ease-in-out infinite;
        }

        @keyframes turn {
            0%, 20% { transform: rotate(0deg); }
            50%, 80% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        @media (orientation: portrait) and (max-width: 1024px) {
            #rotate { display: flex; }
        }
    </style>
  <script type="module" crossorigin src="./assets/index-DTG4ZsI6.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-DfOHZil_.js">
</head>

<body>
    <div id="game-container"></div>
    <div id="rotate"><div class="phone"></div>Turn your device sideways to play!</div>
    <div id="boot">
        <div class="sky" aria-hidden="true">
            <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
            <i class="star s1"></i><i class="star s2"></i><i class="star s3"></i>
            <i class="star s4"></i><i class="star s5"></i><i class="star s6"></i>
        </div>
        <div class="title" aria-label="Learning Adventure"><span style="--i:0">L</span><span style="--i:1">e</span><span style="--i:2">a</span><span style="--i:3">r</span><span style="--i:4">n</span><span style="--i:5">i</span><span style="--i:6">n</span><span style="--i:7">g</span>&nbsp;<span style="--i:8">A</span><span style="--i:9">d</span><span style="--i:10">v</span><span style="--i:11">e</span><span style="--i:12">n</span><span style="--i:13">t</span><span style="--i:14">u</span><span style="--i:15">r</span><span style="--i:16">e</span></div>
        <div class="bar"><i id="boot-fill"></i></div>
        <div class="tip">Loading<b>.</b><b>.</b><b>.</b></div>
    </div>
    <script>
        // The Preloader scene reports real progress here; the Game scene hides
        // the boot screen once the first screen is on show.
        window.bootProgress = function (p) {
            var el = document.getElementById('boot-fill');
            if (el) el.style.width = Math.max(4, Math.min(100, p * 100)) + '%';
        };
        window.bootDone = function () {
            var el = document.getElementById('boot');
            if (!el) return;
            el.classList.add('hidden');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 750);
        };
        // Start the intro animations once Fredoka is in, so the title never
        // pops in with a fallback font.
        (function () {
            var el = document.getElementById('boot');
            var go = function () { el.classList.add('ready'); };
            if (!document.fonts || !document.fonts.load) return go();
            Promise.race([
                Promise.all([document.fonts.load('700 1em Fredoka'), document.fonts.load('600 1em Fredoka')]),
                new Promise(function (resolve) { setTimeout(resolve, 1500); }),
            ]).then(go, go);
        })();
    </script>
</body>

</html>
